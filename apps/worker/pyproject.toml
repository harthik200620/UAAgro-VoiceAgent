[project]
name = "uaagro-worker"
version = "0.1.0"
description = "Background jobs: dialer, post-call processing, retention, embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Observability, the industry-standard stack. `telemetry.py` was written
    # against these from the start and has been a no-op because they were never
    # installed and `setup()` was never called (§19).
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-exporter-prometheus>=0.50b0",
    "prometheus-client>=0.21",
    # The fastest maintained JSON codec. The media path decodes a frame every
    # 20 ms per call; see docs/ARCHITECTURE.md for what that is actually worth.
    "orjson>=3.10",
    # Named explicitly rather than inherited from uvicorn[standard]:
    # §7 depends on this loop and nothing was testing for it.
    "uvloop>=0.21; sys_platform != 'win32'",
    "uaagro-domain",
    "uaagro-db",
    "arq>=0.26",
    "redis>=5.2",
    "structlog>=24.4",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
uaagro-domain = { workspace = true }
uaagro-db = { workspace = true }
