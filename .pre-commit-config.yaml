# Install once per clone:  uv run pre-commit install
# Every commit then runs the secret scan and the fast linters on what is staged.
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan (§17)
        entry: uv run python scripts/secret_scan.py
        language: system
        pass_filenames: true
        always_run: false
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
