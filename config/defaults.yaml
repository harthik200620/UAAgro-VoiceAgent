# =============================================================================
# UA Agro voice platform -- non-secret defaults.
# §22: zero magic numbers in the pipeline. Every threshold, timeout and budget
# is named here (or on an agent_configs row, which overrides these per flow).
# Secrets live only in the environment; nothing in this file is sensitive.
# =============================================================================

identity:
  org_name: "UA Agro Solutions Private Limited"
  brand_name: "Naveen Khushhali Kisan Sewa Kendra"
  helpline_tollfree: "1800 212 7074"
  missed_call_number: "+91 7232020335"
  support_email: "contact@uaagro.in"
  default_timezone: "Asia/Kolkata"
  currency: "INR"

# -----------------------------------------------------------------------------
# §5.1 Language routing. Declarative on purpose -- adding a language is an edit
# here, never an `if` in the pipeline.
#
# Soniox recognises every language this helpline serves and decides the turn
# itself, so the split this table used to carry is gone. Deepgram Flux fused
# recognition and end-of-turn but covered ten languages, which forced Marathi,
# Malayalam and the rest onto Sarvam behind a *local* turn detector -- a second
# model, a second failure mode, and a measurably worse turn feel. One engine
# now, one code path. Both older adapters stay wired and tested as fallbacks.
#
# Odia stays on Sarvam because Soniox's coverage of it is not confirmed, and
# routing a language to an engine on an assumption is how a helpline finds out
# in production that it cannot hear a caller.
#
# The `quality_tier` letters are deliberately NOT raised to match the new
# engines. A tier is a *measured* claim (§5.1) and nothing has been measured
# against Soniox or Bakbak yet; §19.2's per-language turn-detection eval is what
# moves them. The notes say which engine serves the language and that the letter
# is pending, which is the honest version of both.
#
# `tts.language` is BCP-47 throughout, including for Bakbak, whose own codes are
# `hi` and `en-in`. The adapter maps them (§4.1): a vendor's spelling here would
# leak into the audio cache key and into the admin panel.
#
# `voice: null` is not an oversight. Bakbak voice ids are account-scoped UUIDs,
# so they come from BAKBAK_VOICE_* per deployment, and §5.3 requires the choice
# come from a bake-off over a real phone line rather than from a docs example.
# -----------------------------------------------------------------------------
language_routes:
  hi-IN:
    label_en: "Hindi"
    label_native: "हिन्दी"
    stt: { provider: soniox, model: "stt-rt-v5", language_hints: [hi, en] }
    turn: { strategy: soniox_endpoint }
    tts: { provider: bakbak, model: standard, language: hi-IN, voice: null }
    quality_tier: A
    tier_note_en: "Full: vendor-fused semantic end-of-turn, native TTS."
  bho:
    label_en: "Bhojpuri"
    label_native: "भोजपुरी"
    aliases: [awa]              # Awadhi rides the same route
    routes_to: hi-IN            # §5.1: do not attempt a separate model
    quality_tier: B
    tier_note_en: "Good: served by the Hindi path."
  en-IN:
    label_en: "English (India)"
    label_native: "English"
    stt: { provider: soniox, model: "stt-rt-v5", language_hints: [en, hi] }
    turn: { strategy: soniox_endpoint }
    tts: { provider: bakbak, model: standard, language: en-IN, voice: null }
    quality_tier: A
    tier_note_en: "Full: vendor-fused semantic end-of-turn, native TTS."
  mr-IN:
