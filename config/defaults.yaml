  ta-IN:
    label_en: "Tamil"
    label_native: "தமிழ்"
    stt: { provider: soniox, model: "stt-rt-v5", language_hints: [ta] }
    turn: { strategy: soniox_endpoint }
    tts: { provider: bakbak, model: standard, language: ta-IN, voice: null }
    quality_tier: B
