[project]
name = "uaagro-evals"
version = "0.1.0"
description = "Voice evaluation harness: WER, turn detection, golden conversations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uaagro-domain",
    "numpy>=2.2",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uaagro_evals"]

[tool.uv.sources]
uaagro-domain = { workspace = true }
