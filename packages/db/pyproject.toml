[project]
name = "uaagro-db"
version = "0.1.0"
description = "Database models, migrations and seeds for the UA Agro voice platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uaagro-domain",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "cryptography>=44.0",
    "greenlet>=3.1",
    "boto3>=1.35",
    "argon2-cffi>=23.1",
]

[project.scripts]
uaagro-db = "uaagro_db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uaagro_db"]

[tool.uv.sources]
uaagro-domain = { workspace = true }
