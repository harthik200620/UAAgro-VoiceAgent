# Alembic configuration.
# The database URL is NOT set here -- env.py reads it from the environment so a
# connection string never enters the repository (§17).

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
# Migrations are ordered by an explicit numeric prefix rather than by revision
# hash, so `ls versions/` reads chronologically.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
