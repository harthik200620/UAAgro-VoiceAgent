[project]
name = "uaagro-domain"
version = "0.1.0"
description = "Shared domain types for the UA Agro voice platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    # §19's instruments live in this package (uaagro_domain.telemetry) so all
    # three services can export without depending on each other.
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-exporter-prometheus>=0.50b0",
    "prometheus-client>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.4",
    # Not optional: Windows and slim containers ship no system zone database,
    # and §18's calling window and §12.3's working-hours check are both written
    # in IST. See uaagro_domain.timezone.
    "tzdata>=2024.1",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uaagro_domain"]
